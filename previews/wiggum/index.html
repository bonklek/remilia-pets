<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiggum animation gallery</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, monospace; }
    body { margin: 0; padding: 32px; background: #111; color: #eee; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 28px; color: #aaa; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    figure { margin: 0; padding: 18px; background: #1b1b1b; border: 1px solid #333; border-radius: 12px; }
    img { display: block; width: 192px; height: 208px; max-width: 100%; margin: auto; object-fit: contain; image-rendering: auto; }
    figcaption { margin-top: 12px; text-align: center; color: #ddd; }
    footer { margin-top: 28px; }
    footer a { color: #9fe7ff; }
  </style>
</head>
<body>
  <h1>Wiggum</h1>
  <p>Animation preview gallery</p>
  <main>
    <figure><img src="idle.gif" alt="Wiggum idle"><figcaption>Idle</figcaption></figure>
    <figure><img src="running-right.gif" alt="Wiggum running right"><figcaption>Running right</figcaption></figure>
    <figure><img src="running-left.gif" alt="Wiggum running left"><figcaption>Running left</figcaption></figure>
    <figure><img src="waving.gif" alt="Wiggum waving"><figcaption>Waving</figcaption></figure>
    <figure><img src="jumping.gif" alt="Wiggum jumping"><figcaption>Jumping</figcaption></figure>
    <figure><img src="failed.gif" alt="Wiggum reacting to failure"><figcaption>Failed</figcaption></figure>
    <figure><img src="waiting.gif" alt="Wiggum waiting"><figcaption>Waiting</figcaption></figure>
    <figure><img src="running.gif" alt="Wiggum active work"><figcaption>Active work</figcaption></figure>
    <figure><img src="review.gif" alt="Wiggum reviewing"><figcaption>Review</figcaption></figure>
  </main>
  <footer><a href="contact-sheet.png">Open the complete contact sheet</a> · <a href="look-directions.png">Open all look directions</a></footer>
</body>
</html>
